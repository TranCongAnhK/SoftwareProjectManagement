server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/optigym}
spring.datasource.username=${DB_USER:optigym}
spring.datasource.password=${DB_PASSWORD:optigym_local}
spring.sql.init.mode=always
server.error.include-message=never
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
server.forward-headers-strategy=framework
spring.sql.init.schema-locations=classpath:db/schema/01-users.sql,classpath:db/schema/02-email-verification.sql,classpath:db/schema/03-password-reset.sql,classpath:db/schema/04-sessions.sql,classpath:db/schema/05-staff.sql,classpath:db/schema/06-packages.sql,classpath:db/schema/07-subscriptions.sql,classpath:db/schema/08-pt-clients.sql
