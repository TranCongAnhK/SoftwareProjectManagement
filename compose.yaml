services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: optigym
      POSTGRES_USER: optigym
      POSTGRES_PASSWORD: ${DB_PASSWORD:-optigym_local}
    ports:
      - "5432:5432"
    volumes:
      - optigym_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optigym -d optigym"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/optigym
      DB_USER: optigym
      DB_PASSWORD: ${DB_PASSWORD:-optigym_local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-OptiGym Admin}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST in .env}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME in .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  optigym_pg:
